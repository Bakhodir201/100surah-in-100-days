      useEffect(() => {
        document.documentElement.classList.toggle('light', !darkMode);
      }, [darkMode]);

      const toast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3500); };

      return (
        <div className={darkMode ? 'dark' : 'light'}>
          {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
          
          {page !== 'admin' && (
            <Navbar page={page} setPage={setPage} currentUser={currentUser} darkMode={darkMode} setDarkMode={setDarkMode} />
          )}

          <div key={page} className="animate-fadeinup" style={{animationDuration:'0.4s'}}>
            {page === 'home' && <HomePage setPage={setPage} currentUser={currentUser} setCurrentUser={setCurrentUser} toast={toast} />}
            {page === 'daily' && <DailyPage currentUser={currentUser} setCurrentUser={setCurrentUser} toast={toast} />}
            {page === 'leaderboard' && <LeaderboardPage />}
            {page === 'winners' && <WinnersPage />}
            {page === 'admin' && <AdminPage setPage={setPage} />}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
